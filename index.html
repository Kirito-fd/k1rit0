<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hamster Tap Game</title>
    <!-- Подключаем SDK Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #15181c;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 40px 20px;
            overflow: hidden;
        }

        .header {
            text-align: center;
        }

        .title {
            font-size: 16px;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .score {
            font-size: 48px;
            font-weight: 800;
            color: #f1c40f;
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.3);
        }

        .coin-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #f39c12 0%, #d35400 100%);
            border: 8px solid #f1c40f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(243, 156, 18px, 0.5);
            transition: transform 0.05s ease;
        }

        .coin-btn:active {
            transform: scale(0.93);
        }

        .footer {
            width: 100%;
            max-width: 300px;
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #2c3e50;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            border-radius: 6px;
            transition: width 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">Баланс монет</div>
        <div class="score" id="score">0</div>
    </div>

    <div class="coin-btn" id="coin">🐹</div>

    <div class="footer">
        <div class="energy-info">
            <span>⚡ Энергия</span>
            <span id="energy-text">1000 / 1000</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="energy-bar"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем кликер во весь экран

        const MAX_ENERGY = 1000;
        let count = Number(localStorage.getItem('coins')) || 0;
        let energy = Number(localStorage.getItem('energy')) ?? MAX_ENERGY;

        const scoreEl = document.getElementById('score');
        const energyTextEl = document.getElementById('energy-text');
        const energyBarEl = document.getElementById('energy-bar');
        const coinBtn = document.getElementById('coin');

        function updateUI() {
            scoreEl.innerText = count.toLocaleString();
            energyTextEl.innerText = `${energy} /${MAX_ENERGY}`;
            energyBarEl.style.width = `${(energy / MAX_ENERGY) * 100}%`;
        }

        updateUI();

        coinBtn.addEventListener('click', () => {
            if (energy > 0) {
                count += 1;
                energy -= 1;

                localStorage.setItem('coins', count);
                localStorage.setItem('energy', energy);

                updateUI();

                // Виброотклик в Telegram при каждом тапе
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            }
        });

        // Регенерация +1 энергии в секунду
        setInterval(() => {
            if (energy < MAX_ENERGY) {
                energy += 1;
                localStorage.setItem('energy', energy);
                updateUI();
            }
        }, 1000);
    </script>
</body>
</html>
